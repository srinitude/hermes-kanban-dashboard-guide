[tools]
bun = "1.3.13"
node = "24"

[tasks.install]
description = "Install the locked dependency graph"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the Astro development server"
run = "bun run dev"

[tasks.format]
description = "Check source formatting"
run = "bun run format:check"

[tasks.check]
description = "Run Astro diagnostics"
run = "bun run check"

[tasks.build]
description = "Build the static site"
run = "bun run build"

[tasks.test]
description = "Run output behavior tests"
run = "bun run test"

[tasks.ci]
description = "Run the complete local and GitHub CI path"
run = [
  "bun install --frozen-lockfile",
  "bun run format:check",
  "bun run check",
  "bun run build",
  "bun run test",
]
