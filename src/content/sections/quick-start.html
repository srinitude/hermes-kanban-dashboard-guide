<section class="section searchable" id="quick-start" data-keywords="start first task ready running done" data-feature="create-task completion-summary"><h2>Your first task in six moves</h2><p class="intro">This path covers the part most people need first. Check each move as you do it. Your checks stay in this browser.</p><div class="steps"><label class="step checkline"><input type="checkbox" data-progress="1"><span><strong>Open the right board.</strong>Use the board selector if you have more than one project.</span></label><label class="step checkline"><input type="checkbox" data-progress="2"><span><strong>Choose a starting column and click <span class="ui-label">+</span>.</strong>Use <span class="ui-label">Triage</span> for a rough idea. Use <span class="ui-label">Todo</span> when the request is already clear but is not ready to run.</span></label><label class="step checkline"><input type="checkbox" data-progress="3"><span><strong>Enter a specific title and choose a safe workspace.</strong>For project files, use a preserved Git worktree or directory. Temporary work is deleted after completion.</span></label><label class="step checkline"><input type="checkbox" data-progress="4"><span><strong>Make the card ready.</strong>Open it, add a description and assignee if needed, then move it to <span class="ui-label">Ready</span>.</span></label><label class="step checkline"><input type="checkbox" data-progress="5"><span><strong>Start now or wait for the dispatcher.</strong>Click <span class="ui-label">Nudge dispatcher</span> to avoid waiting for the next tick. The card enters <span class="ui-label">In Progress</span> when a worker claims it.</span></label><label class="step checkline"><input type="checkbox" data-progress="6"><span><strong>Read the result.</strong>Open the card in <span class="ui-label">Done</span>. Check Result, worker log, events, attachments, and run history. If you complete a card yourself, Hermes asks for a completion summary and stores it as the result.</span></label></div><div class="callout good"><strong>Proof that it ran:</strong> the card reached In Progress, has a run in Run history, and then reached Done with a Result or latest summary.</div></section>
